# keyd keymap for the Google Kukui (MT8183 "kukui" / "krane" / "jacuzzi") family.
#
# Why a key remapper at all: MT8183 ChromeOS device trees map the top row to
# *action* keys (KEY_BACK, KEY_FORWARD, KEY_REFRESH, KEY_FULL_SCREEN, KEY_SCALE,
# KEY_BRIGHTNESS{DOWN,UP}, KEY_MUTE, KEY_VOLUME{DOWN,UP}), so neither internal
# cros_ec clamshell keyboards (jacuzzi) nor pogo/USB Hammer detachable keyboards
# (krane, kodama, kakadu) emit raw F1-F10.  Reaching a virtual terminal needs
# real F-key keycodes: the kernel maps Ctrl+Alt+F<n> to Console_<n>, and sway
# reacts to XF86Switch_VT_<n>.  keyd supplies F-keys without giving up action keys.
#
# Layers:
#   [main]         top row = ChromeOS action keys
#   [meta]         Search + top row     -> F1-F10
#   [control+alt]  Ctrl+Alt + top row   -> Ctrl+Alt+F1-F10 -> VT 1-10
#   [alt]          Alt+Backspace = Delete; Alt+brightness = keyboard backlight
#                  Alt+Search = F20 (rofi-files --search); Search alone opens launcher
#   [control]      Ctrl+F5 / Ctrl+Scale = SysRq
#   [altgr]        Backspace = Delete, arrows = Home/End/PgUp/PgDn
#
# Lock key (KEY_SLEEP) is intentionally NOT remapped so systemd-logind suspends
# directly without polkit while sway binds XF86Sleep to swaylock.
# Emergency exit: keyd quits on backspace+escape+enter, releasing the keyboard.

[ids]
# Exclude non-keyboard cros_ec switch/button devices and headset jacks sharing
# 0000:0000 so keyd never swallows EV_SW (lid / tablet-mode) or power/volume keys.
-0000:0000:c68a2d8e
-0000:0000:3c5e67dc

# Internal cros-ec / jacuzzis plus all Google Hammer USB/pogo detachable keyboards
# (masterball 503c, magnemite 503d, moonball 5044, don 5050, eel 5057, plus
# hammer/staff/wand/whiskers/jewel and related ChromeOS detachable bases).
k:0000:0000
k:0001:0001
k:18d1:5022
k:18d1:502b
k:18d1:502d
k:18d1:5030
k:18d1:503c
k:18d1:503d
k:18d1:5044
k:18d1:504c
k:18d1:5050
k:18d1:5052
k:18d1:5057
k:18d1:505b
k:18d1:5061

